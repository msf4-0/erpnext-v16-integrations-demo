# Recipe — barcode_shrdc (ERPNext Barcode Integration, msf4-0).
#
# Only genuinely app-specific residual facts go here. Things install-app.sh
# derives generically (the .pth flat/nested layout, which doctype to verify
# against, Single-doctype table recovery, the Custom Script -> Client Script
# auto-conversion, and missing-DocType custom_field pruning) are NOT declared
# here on purpose.
#
# Source URL is the live registry entry; see ../APP-SOURCES.md.
# This is the operator's own recipe (overrides examples/barcode_shrdc.yaml).

app: barcode_shrdc
repo: https://github.com/msf4-0/ERPNext-Barcode-Integration
# NOTE: upstream master historically had runtime bugs on v15 (QR-on-unsaved
# error, broken run_doc_method item fetch, custom_field fixture aborting
# mid-file). If you maintain a fixed fork, point `repo:` at it or add a
# per-version `source:` (a local directory under ./repos/) — install-app.sh
# accepts a directory as its <repo> argument and copies+registers it by hand:
#   docker compose -p erpnext-sandbox cp ./repos/<your-fork> bench:/tmp/<your-fork>
#   docker compose -p erpnext-sandbox exec bench bash -lc \
#     "/tmp/scripts/install-app.sh barcode_shrdc /tmp/<your-fork> 15 /tmp/recipes/barcode_shrdc.yaml"
# The v12/v16 entries below apply to upstream master.

versions:
  "12":
    branch: master
    verified: true
    extra_pip:
      - qrcode
    verify_doctype: Barcode Printing
    notes: |
      Legacy v12 target. 'Custom Script' is still a native v12 doctype
      (the rename to 'Client Script' happens in v15), so common.sh's
      check_custom_script_fixture (gated on v15+) is a no-op here — the
      fixtures stay as Custom Script and are synced directly. verify_doctype
      pinned to 'Barcode Printing' (a normal doctype -> 200), not the
      auto-detected Single doctype.
  "15":
    branch: main
    verified: true
    extra_pip:
      - qrcode
      - reportlab
      - rlPyCairo
    verify_doctype: Barcode Printing
    notes: |
      Requirements:
      - Native (root, once per container): `apt-get install -y libcairo2-dev
        pkg-config` — rlPyCairo won't build without cairo headers. These live
        in the container writable layer, so a container recreate wipes them.
      - Python (bench venv): the fixed fork's requirements.txt lists frappe,
        qrcode, reportlab and rlPyCairo; extra_pip repeats them so upstream
        installs also work.

      Local v15 fix fork: `./repos/barcode-shrdc-v15-fixed` (upstream commit
      1aaedd6 + fixes). It prunes the stray Frepple custom field, adds the
      unsaved-QR guard, maps CODE39 -> Standard39, renders the Stock Entry
      Barcode format server-side, and falls back to SVG when rlPyCairo is
      unavailable. Install it from the directory:
        docker compose -p erpnext-sandbox cp ./repos/barcode-shrdc-v15-fixed bench:/tmp/barcode-shrdc-v15-fixed
        docker compose -p erpnext-sandbox exec bench bash -lc "/tmp/scripts/install-app.sh barcode_shrdc /tmp/barcode-shrdc-v15-fixed 15 /tmp/recipes/barcode_shrdc.yaml"
      For PDF/print images, set a container-reachable host name:
        docker compose -p erpnext-sandbox exec bench bash -lc "bench --site frontend set-config host_name http://localhost:8000"

      Upstream fixtures (if installing upstream main) still ship the Frepple
      entry. On v15 `install-app`/`migrate` ABORTS the whole custom_field file
      when it hits that missing DocType, so the 5 barcode fields after it
      (Delivery Note-barcode_validation, Delivery Note Item-checking_qty,
      Stock Entry-stock_check, Stock Entry Detail-checking_qty, Sales Invoice
      Item-reference_dt/reference_dn) silently never sync. Prune any fixture
      whose `dt` is not installed, then re-run `bench --site frontend migrate`.
      Verify:
        SELECT name FROM `tabCustom Field` WHERE name LIKE '%checking_qty%';
      Expected rows: Delivery Note Item / Stock Entry Detail checking_qty.

      'Custom Script' -> 'Client Script' conversion (v15) is handled by
      common.sh.
  "16":
    branch: master
    verified: true
    extra_pip:
      - qrcode
    verify_doctype: Barcode Printing
    notes: |
      DURABLE FIX NOW EXISTS — prefer the local fix fork over upstream master.
      `./repos/barcode-shrdc-v16` (branch `fix/v16-compat`, commit b79b4d6)
      carries all the v16 runtime fixes committed in source, so a fresh install
      is clean with NO post-install patching. Install it from the directory:
        docker compose -p erpnext-sandbox cp ./repos/barcode-shrdc-v16 bench:/tmp/barcode-shrdc-v16
        docker compose -p erpnext-sandbox exec -u root bench bash -lc \
          "chown -R frappe:frappe /tmp/barcode-shrdc-v16"
        docker compose -p erpnext-sandbox cp ./sandbox/scripts/fix-barcode-v16-renderdeps.sh bench:/tmp/scripts/
        docker compose -p erpnext-sandbox exec -u root bench bash -lc "bash /tmp/scripts/fix-barcode-v16-renderdeps.sh"
        docker compose -p erpnext-sandbox exec bench bash -lc \
          "/tmp/scripts/install-app.sh barcode_shrdc /tmp/barcode-shrdc-v16 16 /tmp/recipes/barcode_shrdc.yaml"
      The fork's requirements.txt now lists reportlab + rlPyCairo, but those
      need the native cairo headers FIRST, so run the root render-deps step
      before install (or after — install-app.sh tolerates the failed pip).
      `branch:` is irrelevant for a directory install; recorded for a future
      git URL (the fork has no remote).

      Fallback (ONLINE upstream master + patch): if installing straight from
      https://github.com/msf4-0/ERPNext-Barcode-Integration (branch master),
      run these AFTER install, because upstream still has the bugs:
        1. (root) fix-barcode-v16-renderdeps.sh
        2. fix-barcode-v16.sh  (Python + JS + previews + print formats + jinja
           hook + host_name + cache/serve restart; 7 idempotent steps)
      The fork exists precisely so nobody has to do step 2 again.

      ---- why the fork was needed (the bugs it fixes, all reproduced over
      authenticated HTTP on a clean v16 install) ----
        - item_code fetch -> run_doc_method get_item_details 403 "You are
          not permitted to access this resource ... get_item_details is not
          whitelisted" (the *class* method lacked @frappe.whitelist()).
        - module-level get_item_details -> 500 (invalid SQL on tabItem
          Barcode + assumed an unparsed dict had `.doc`).
        - "Create QR" before saving -> 404 DoesNotExistError
          "Barcode Printing new-... not found".
        - save -> TypeError item.serial_no.split is not a function (v16's
          erpnext.stock.get_item_details.get_serial_no is a stub returning []).
        - JS references removed v16 APIs: erpnext.setup_serial_no(),
          erpnext.SerialNoBatchSelector (-> SerialBatchPackageSelector), and
          the non-whitelisted get_item_code (-> erpnext.stock.utils.scan_barcode).
        - print formats: Barcode formats used CDN JsBarcode `<svg>` (blank in
          print/PDF) + `resize: both`/`overflow: auto` CSS (clipped text); QR
          emitted data:image/png;base64 URIs. Fixed by server-side renderers
          get_barcode_image()/get_qr_image() writing public /files/*.png,
          exposed to Jinja via the `jinja` hook.
        - on-form "Preview:" sections rendered client-side via
          $.getScript(jsdelivr JsBarcode); now the whitelisted
          get_preview_html() (same renderer, works on an UNSAVED doc, and
          _save_public_image() names files by content hash so re-toggling
          reuses one PNG).
        - print/PDF -> OSError HostNotFoundError (no host_name, so get_url()
          returned the container hostname the local wkhtmltopdf cannot
          resolve). Site-level fix: `bench set-config host_name
          http://localhost:8000` (fix-barcode-v16-hostname.sh, HOST_URL=...).
          Not barcode-specific.

      get-app used to abort during uv/pypika dependency resolution (uv
      refuses the `pypika @ git+...` URL dependency in requirements.txt)
      but still cloned the app. install-app.sh sets BENCH_DISABLE_UV=1
      on get-app so bench uses pip, which handles the URL dependency fine
      and get-app completes cleanly — the generic recovery path is now
      only a fallback, not the normal flow.

      hooks.py referenced 'Custom Script' fixtures, which don't exist as
      a table in v16 (renamed to 'Client Script'). common.sh auto-converts
      the fixture (rename file + flip doctype + update hooks.py) on v16+,
      so this no longer needs hand-fixing — and the fork already ships
      client_script.json.

      verify_doctype is pinned to 'Barcode Printing' because the
      auto-detected first doctype (QR Code Configuration) is a Single
      doctype with no table, so an authenticated REST GET against it
      returns 500 (TableMissingError). Barcode Printing is a normal
      doctype and returns 200.

      custom_field.json fixture abort (verified on a clean v16 install):
      the fixture ships 21 records, including borrowed fields from other
      apps, and record #15 is `Frepple Item Distribution-absd` — a DocType
      not installed on a stock ERPNext site. frappe ABORTS the remainder of
      the file at that record, so the 5 barcode fields AFTER it silently
      never sync (Delivery Note-barcode_validation, Delivery Note
      Item-checking_qty, Stock Entry-stock_check, Stock Entry
      Detail-checking_qty, Sales Invoice Item-reference_dt/dn). common.sh's
      filter_missing_custom_field_dts is version-independent and prunes any
      fixture whose target DocType is absent; confirmed it drops exactly the
      Frepple record, then migrate syncs all 20 remaining fields.

      EPHEMERALITY: the fork lives at ./repos/barcode-shrdc-v16 (gitignored,
      local-only) and is therefore durable across container recreates ON THIS
      MACHINE, but it is NOT shareable and has NO remote. The real end state
      is to push `fix/v16-compat` to a GitHub fork and point `repo:` at that
      URL (the upstream PR was already planned in install-log entry #30).

# Auto-detected by install-app.sh, not declared:
#   .pth target        -> nested layout, apps/barcode_shrdc/barcode_shrdc
