# comp_demo - COMPLETE self-contained ERPNext demo stack.
#
# One project, one command: ERPNext v16 + barcode/QR (barcode_shrdc) +
# Shopify <-> ERPNext bridge (Node-RED + ngrok) + the drag-and-drop production
# planner (scheduler). Nothing is shared with the old `erpnext-sandbox`,
# `frappe_docker-1` or `erpnext-ai-fix` projects: own name, own volumes, own
# ports.
#
#   bench      : ERPNext v16 bench, baked from bake/bench.Dockerfile
#   db         : MariaDB 11.8 (durable `db_data` named volume)
#   redis-*    : cache + queue
#   node-red   : Shopify <-> ERPNext bridge, runs ./flows.json
#   scheduler  : production planner (Express API + React SPA, port 3001)
#
# ngrok is NOT a container here: the host ngrok binary is already authenticated
# and pulling ngrok/ngrok:latest stalls on this machine, so up.ps1 starts the
# host binary instead and reads the public URL back from its local API.
#
# Start with:  powershell -File F:\ERPNEXT\erpnext-build\up.ps1

name: comp_demo

services:
  bench:
    # Baked image: frappe + erpnext v16 + barcode_shrdc + shopify + eu_einvoice
    # + render deps are baked INTO the image at build time (bake/bench.Dockerfile),
    # so a fresh clone can reproduce the exact image without re-provisioning.
    image: comp_demo-bench:v16
    build:
      context: .
      dockerfile: bake/bench.Dockerfile
    # Auto-start the web server + scheduler + worker as the container's main
    # process, so the site comes back on its own after a laptop reboot or
    # Docker Desktop restart (no manual `bench serve` needed).
    command:
      - bash
      - -lc
      - |
        cd /home/frappe/frappe-bench
        # --- self-heal the site DB grant on EVERY container start -------------
        # `bench new-site` creates the site's db_user bound to the bench
        # container's IP at that moment (e.g. _3b8...@172.20.0.5). Any
        # `docker compose down/up`, `create`, or Docker Desktop restart hands
        # the container a NEW bridge IP, the grant stops matching, and the
        # whole site 500s with:
        #   (1045) Access denied for user '...'@'172.20.0.x' (using password: YES)
        # Re-asserting a host-agnostic ('%') grant here makes the stack
        # self-healing on every start without touching the data. Bounded
        # (60 x 2 s) and best-effort - it must never block `bench serve`.
        # NOTE: every shell `$` is written `$$` on purpose. Compose interpolates
        # `$VAR` / `${VAR}` in this file, so a single `$` is consumed before the
        # container ever sees it (`$CFG` would expand to empty). `$$` is Compose's
        # escape for a literal `$` and reaches bash intact.
        CFG="sites/$${SITE_NAME:-frontend}/site_config.json"
        if [ -f "$$CFG" ]; then
          DU=$$(sed -n 's/.*"db_user"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$$CFG")
          DP=$$(sed -n 's/.*"db_password"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$$CFG")
          DN=$$(sed -n 's/.*"db_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$$CFG")
          if [ -n "$$DU" ] && [ -n "$$DP" ]; then
            for i in $$(seq 1 60); do
              if MYSQL_PWD="$$DB_ROOT_PASSWORD" mariadb -h db -uroot -e "SELECT 1" >/dev/null 2>&1; then
                MYSQL_PWD="$$DB_ROOT_PASSWORD" mariadb -h db -uroot -e "CREATE USER IF NOT EXISTS '$$DU'@'%' IDENTIFIED BY '$$DP'; ALTER USER '$$DU'@'%' IDENTIFIED BY '$$DP'; GRANT ALL PRIVILEGES ON \`$${DN:-$$DU}\`.* TO '$$DU'@'%'; FLUSH PRIVILEGES;" \
                  && echo "db-grant: re-asserted $$DU@%" || echo "db-grant: WARN could not re-assert $$DU@%"
                break
              fi
              sleep 2
            done
          fi
        fi
        # --- re-register bind-mounted apps as importable packages ------------
        # env/lib/.../site-packages/*.pth lives in the container image layer, so
        # it is lost on every recreate. Without it `bench` cannot import an app
        # that is bind-mounted from ./repos (ModuleNotFoundError -> site 500).
        for appdir in apps/*/; do
          app="$$(basename "$$appdir")"
          [ -d "$$appdir/$$app" ] || continue
          for sp in env/lib/python*/site-packages; do
            echo "/home/frappe/frappe-bench/apps/$$app" > "$$sp/$$app.pth"
          done
        done
        # --- re-create /assets/<app> aliases --------------------------------
        # These symlinks live in the container layer and were lost on recreate,
        # so every /assets/item_tracking/... URL 404'd (no Shift+I scanner JS).
        mkdir -p assets
        for appdir in apps/*/; do
          app="$$(basename "$$appdir")"
          [ -d "$$appdir/$$app/public" ] || continue
          ln -sfn "../apps/$$app/$$app/public" "assets/$$app"
        done
        setsid nohup bench schedule > /tmp/bench-schedule.log 2>&1 &
        setsid nohup bench worker --queue short,default,long >> logs/worker.log 2>&1 &
        exec bench serve --port 8000
    ports:
      - "${ERPNEXT_PORT:-8000}:8000"
    volumes:
      - bench_sites:/home/frappe/frappe-bench/sites
      # item_tracking normally lives only in the container's writable layer, so
      # every container recreate (image rebuild / compose up) reverted it to the
      # baked image copy and the Shift+I camera scanner + custom pages vanished.
      # Bind-mount the host repo so the app code is permanent across restarts.
      - ./repos/item_tracking:/home/frappe/frappe-bench/apps/item_tracking
      - ./repos/metabase_integration:/home/frappe/frappe-bench/apps/metabase_integration
      # barcode_shrdc has the same failure mode: the image ships an old copy
      # (no get_serial_summary/ensure_serials) while the source repo has the
      # version the Get Items Barcode button expects. Mount the repo so the
      # serial-number flow exists and survives restarts.
      - ./repos/barcode-shrdc-v16-fixed:/home/frappe/frappe-bench/apps/barcode_shrdc
    depends_on:
      - db
      - redis-cache
      - redis-queue
    environment:
      - PYTHONUNBUFFERED=1
      - SITE_NAME=${SITE_NAME:-frontend}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-admin}
      - ERPNEXT_INTERNAL_URL=http://bench:8000
      # yarn network resilience: this host's route to registry.yarnpkg.com is
      # flaky, and `bench get-app erpnext` fails fast when `yarn install` times
      # out (ESOCKETTIMEDOUT). One socket at a time + longer timeout + more
      # fetch retries make the app install survive transient drops.
      - YARN_NETWORK_TIMEOUT=600000
      - YARN_NETWORK_CONCURRENCY=1
      - YARN_FETCH_RETRIES=5
      - YARN_FETCH_RETRY_MAXTIMEOUT=120000
    restart: unless-stopped

  db:
    image: mariadb:11.8
    # DURABLE DATADIR (bake track 2b): the site DB now lives on the `db_data`
    # named volume instead of tmpfs, so a container stop / Docker restart no
    # longer discards it. The one-time cost is the initial populate/restore on
    # this host's slow container-storage write path (see bake/README.md). The
    # flush knobs below trade single-transaction crash-safety for write speed;
    # they do not affect durability across restarts.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-flush-method=nosync
      - --innodb-doublewrite=0
      - --sync-binlog=0
      - --skip-log-bin
      - --innodb-buffer-pool-size=512M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped

  node-red:
    image: nodered/node-red:latest
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    volumes:
      - node_red_data:/data
      - ${FLOWS_PATH:-./sandbox/node-red/flows.json}:/data/flows.json
    environment:
      - TZ=${TZ:-UTC}
      - ERPNEXT_INTERNAL_URL=${ERPNEXT_INTERNAL_URL:-http://bench:8000}
      - SHOPIFY_STORE=${SHOPIFY_STORE:-4e1075.myshopify.com}
      - SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-2026-04}
    depends_on:
      - bench
    restart: unless-stopped

  scheduler:
    image: comp_demo-scheduler:latest
    build:
      # vendored inside comp_demo so the project builds without ERPNEXT-AI-FIX
      context: ./scheduler
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_ERPNEXT_URL: http://localhost:${ERPNEXT_PORT:-8000}
    ports:
      - "${SCHEDULER_PORT:-3001}:3000"
    environment:
      - ERPNEXT_URL=http://bench:8000
      - ERPNEXT_API_KEY=${SCHEDULER_ERPNEXT_API_KEY:-}
      - ERPNEXT_API_SECRET=${SCHEDULER_ERPNEXT_API_SECRET:-}
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - bench
    restart: unless-stopped

  metabase:
    # BI / analytics dashboard. Metabase's own application metadata lives in the
    # `metabase` schema of the `db` MariaDB (durable via the db_data volume). The
    # ERPNext site DB is registered as a *data source* from the Metabase UI
    # (http://localhost:3000) once, using the metabase_user credentials in .env.
    # Pinned to the v0.58 LTS line (the newer v0.63+/v0.65 images ship a Lowdefy
    # frontend whose classic /api/* REST endpoints are no longer available).
    image: metabase/metabase:v0.58.38.2
    ports:
      - "${METABASE_PORT:-3005}:3000"
    environment:
      - MB_DB_TYPE=mysql
      - MB_DB_HOST=db
      - MB_DB_PORT=3306
      - MB_DB_DBNAME=metabase
      - MB_DB_USER=${METABASE_DB_USER:-metabase_user}
      - MB_DB_PASS=${METABASE_DB_PASS:-metabase_demo_2026}
      # Keep the JVM heap within the container memory cap below.
      - JAVA_OPTS=-Xms512m -Xmx2g
    # Cap Metabase so it can't monopolise this host (it tracks 1000+ ERPNext tables).
    mem_limit: 3g
    cpus: 2.0
    depends_on:
      - db
    restart: unless-stopped

volumes:
  bench_sites:
  db_data:
  node_red_data:
