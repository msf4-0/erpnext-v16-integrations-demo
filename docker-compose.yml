# comp_demo - COMPLETE self-contained ERPNext demo stack.
#
# One project, one command: ERPNext + barcode/QR (barcode_shrdc) +
# Shopify <-> ERPNext bridge (Node-RED + ngrok) + the drag-and-drop production
# planner (scheduler). Nothing is shared with the old `erpnext-sandbox`,
# `frappe_docker-1` or `erpnext-fix` projects: own name, own volumes, own
# ports.
#
#   bench      : ERPNext bench, baked from bake/bench.Dockerfile
#   db         : MariaDB (tag pinned in versions.env; durable `db_data` volume)
#   redis-*    : cache + queue
#   node-red   : Shopify <-> ERPNext bridge, runs ./flows.json
#   scheduler  : production planner (Express API + React SPA, port 3001)
#
# ngrok is NOT a container here: the host ngrok binary is already authenticated
# and pulling ngrok/ngrok:latest stalls on this machine, so up.ps1 starts the
# host binary instead and reads the public URL back from its local API.
#
# Start with:  powershell -File .\up.ps1   (from this repository root)

name: comp_demo

services:
  bench:
    # Baked image: frappe + erpnext + barcode_shrdc + shopify
    # + render deps are baked INTO the image at build time (bake/bench.Dockerfile),
    # so a fresh clone can reproduce the exact image without re-provisioning.
    # `start.ps1` pulls ghcr.io/msf4-0/comp-demo-bench:v16 on a first run and
    # tags it as comp_demo-bench:v16, so this service starts without a build.
    # The build: block below is the offline fallback (25-40 min). The image is
    # private until a maintainer flips the package to Public - see
    # docs/DISTRIBUTION.md.
    image: ${BENCH_IMAGE:-comp_demo-bench:v16}
    build:
      context: .
      dockerfile: bake/bench.Dockerfile
      args:
        ERPNEXT_BASE: ${ERPNEXT_BASE:?Load versions.env before starting Compose}
    # Auto-start the web server + scheduler + worker as the container's main
    # process, so the site comes back on its own after a laptop reboot or
    # Docker Desktop restart (no manual `bench serve` needed).
    command:
      - bash
      - -lc
      - |
        cd /home/frappe/frappe-bench
        # --- reject demo credentials in production ---------------------------
        DEFAULT_SECRET_KEYS=""
        [ "$${DB_ROOT_PASSWORD:-}" != "admin" ] || DEFAULT_SECRET_KEYS="$$DEFAULT_SECRET_KEYS DB_ROOT_PASSWORD"
        [ "$${DB_ROOT_PASSWORD:-}" != "__FILL_ME__" ] || DEFAULT_SECRET_KEYS="$$DEFAULT_SECRET_KEYS DB_ROOT_PASSWORD"
        [ "$${ERPNEXT_ADMIN_PASSWORD:-}" != "admin" ] || DEFAULT_SECRET_KEYS="$$DEFAULT_SECRET_KEYS ERPNEXT_ADMIN_PASSWORD"
        [ "$${ERPNEXT_ADMIN_PASSWORD:-}" != "__FILL_ME__" ] || DEFAULT_SECRET_KEYS="$$DEFAULT_SECRET_KEYS ERPNEXT_ADMIN_PASSWORD"
        [ "$${METABASE_DB_PASS:-}" != "metabase_demo_2026" ] || DEFAULT_SECRET_KEYS="$$DEFAULT_SECRET_KEYS METABASE_DB_PASS"
        [ "$${METABASE_DB_PASS:-}" != "__FILL_ME__" ] || DEFAULT_SECRET_KEYS="$$DEFAULT_SECRET_KEYS METABASE_DB_PASS"
        [ "$${METABASE_ADMIN_PASSWORD:-}" != "DemoPass2026!" ] || DEFAULT_SECRET_KEYS="$$DEFAULT_SECRET_KEYS METABASE_ADMIN_PASSWORD"
        [ "$${METABASE_ADMIN_PASSWORD:-}" != "__FILL_ME__" ] || DEFAULT_SECRET_KEYS="$$DEFAULT_SECRET_KEYS METABASE_ADMIN_PASSWORD"
        if [ -n "$$DEFAULT_SECRET_KEYS" ]; then
          echo "startup policy: demo-default credentials:$${DEFAULT_SECRET_KEYS}"
        else
          echo "startup policy: no demo-default credentials detected"
        fi
        ENV_MODE=$$(printf '%s' "$${ENVIRONMENT:-development}" | tr '[:upper:]' '[:lower:]')
        if [ "$$ENV_MODE" = "production" ] && [ -n "$$DEFAULT_SECRET_KEYS" ]; then
          echo "ERROR: production startup refused; replace:$${DEFAULT_SECRET_KEYS}" >&2
          exit 1
        fi
        # --- node on PATH -----------------------------------------------------
        # The frappe image ships node only under ~/.nvm/...; nothing adds it to
        # PATH. Without this, every `bench build` (and therefore every asset
        # rebuild) dies with "bin/sh: 1: node: not found". up.ps1 shims PATH for
        # its own calls, but anything run by hand - or by a colleague following
        # the troubleshooting guide - hits the failure.
        NODE_BIN="$$(ls -d /home/frappe/.nvm/versions/node/*/bin 2>/dev/null | tail -1)"
        [ -n "$$NODE_BIN" ] && export PATH="$$NODE_BIN:$$PATH"
        # --- self-heal the site DB grant on EVERY container start -------------
        # `bench new-site` creates the site's db_user bound to the bench
        # container's IP at that moment (e.g. _3b8...@172.20.0.5). Any
        # `docker compose down/up`, `create`, or Docker Desktop restart hands
        # the container a NEW bridge IP, the grant stops matching, and the
        # whole site 500s with:
        #   (1045) Access denied for user '...'@'172.20.0.x' (using password: YES)
        # Re-asserting a host-agnostic ('%') grant here makes the stack
        # self-healing on every start without touching the data. Bounded
        # (60 x 2 s) and best-effort - it must never block `bench serve`.
        # NOTE: every shell `$` is written `$$` on purpose. Compose interpolates
        # `$$VAR` / `$${VAR}` in this file, so a single `$` is consumed before the
        # container ever sees it (`$$CFG` would expand to empty). `$$` is Compose's
        # escape for a literal `$` and reaches bash intact.
        CFG="sites/$${SITE_NAME:-frontend}/site_config.json"
        if [ -f "$$CFG" ]; then
          DU=$$(sed -n 's/.*"db_user"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$$CFG")
          DP=$$(sed -n 's/.*"db_password"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$$CFG")
          DN=$$(sed -n 's/.*"db_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$$CFG")
          if [ -n "$$DU" ] && [ -n "$$DP" ]; then
            for i in $$(seq 1 60); do
              if MYSQL_PWD="$$DB_ROOT_PASSWORD" mariadb -h db -uroot -e "SELECT 1" >/dev/null 2>&1; then
                MYSQL_PWD="$$DB_ROOT_PASSWORD" mariadb -h db -uroot -e "CREATE USER IF NOT EXISTS '$$DU'@'%' IDENTIFIED BY '$$DP'; ALTER USER '$$DU'@'%' IDENTIFIED BY '$$DP'; GRANT ALL PRIVILEGES ON \`$${DN:-$$DU}\`.* TO '$$DU'@'%'; FLUSH PRIVILEGES;" \
                  && echo "db-grant: re-asserted $$DU@%" || echo "db-grant: WARN could not re-assert $$DU@%"
                break
              fi
              sleep 2
            done
          fi
        fi
        # --- re-register bind-mounted apps as importable packages ------------
        # env/lib/.../site-packages/*.pth lives in the container image layer, so
        # it is lost on every recreate. Without it `bench` cannot import an app
        # that is bind-mounted from ./repos (ModuleNotFoundError -> site 500).
        for appdir in apps/*/; do
          app="$$(basename "$$appdir")"
          [ -d "$$appdir/$$app" ] || continue
          for sp in env/lib/python*/site-packages; do
            echo "/home/frappe/frappe-bench/apps/$$app" > "$$sp/$$app.pth"
          done
        done
        # --- re-create /assets/<app> aliases --------------------------------
        # These symlinks live in the container layer and were lost on recreate,
        # so every /assets/item_tracking/... URL 404'd (no Shift+I scanner JS).
        mkdir -p assets
        for appdir in apps/*/; do
          app="$$(basename "$$appdir")"
          [ -d "$$appdir/$$app/public" ] || continue
          ln -sfn "../apps/$$app/$$app/public" "assets/$$app"
        done
        # --- report any ACTIVE app_include_js that does not resolve ----------
        # Frappe loads these on every desk page. A 404 makes the desk reload
        # itself in a loop ("the front-end site keeps restarting"), which looks
        # like a browser bug and is nearly impossible to guess from the console.
        # Log it loudly, but never fail: a missing optional asset must not take
        # the whole site down. Commented-out hooks lines are ignored.
        for appdir in apps/*/; do
          app="$$(basename "$$appdir")"
          hooks="$$appdir/$$app/hooks.py"
          [ -f "$$hooks" ] || continue
          grep -v '^[[:space:]]*#' "$$hooks" \
            | grep -oE '"/assets/[^"]+\.(js|css)"' | tr -d '"' \
            | while read -r u; do
                [ -e "sites$$u" ] || echo "asset-check: MISSING $$u  (referenced by $$app/hooks.py - the desk will reload-loop)"
              done
        done
        setsid nohup bench schedule > /tmp/bench-schedule.log 2>&1 &
        setsid nohup bench worker --queue short,default,long >> logs/worker.log 2>&1 &
        exec bench serve --port 8000
    ports:
      - "${ERPNEXT_PORT:-8000}:8000"
    volumes:
      - bench_sites:/home/frappe/frappe-bench/sites
      # P7: no application source is bind-mounted any more. All six custom apps
      # (barcode_shrdc, shopify, item_tracking,
      # metabase_integration, my_invois) are baked into the image by
      # bake/bench.Dockerfile, so a clean clone runs on the image alone.
      # To live-edit an app without rebuilding, re-add an override mount here,
      # e.g.  - ./repos/item_tracking:/home/frappe/frappe-bench/apps/item_tracking
      # (the container start-up block re-registers whatever is in apps/).
      - ./repos/dsh:/home/frappe/frappe-bench/apps/dsh_bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # A fresh clone has an empty bench_sites volume, so bench would serve
      # "404 localhost does not exist". `seed` restores the demo DB first, then
      # exits; bench only starts once that succeeded.
      seed:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    environment:
      - DSH_SIDECAR_URL=http://host.docker.internal:8099
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SITE_NAME=${SITE_NAME:-frontend}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-admin}
      - ERPNEXT_ADMIN_PASSWORD=${ERPNEXT_ADMIN_PASSWORD:-admin}
      - METABASE_DB_PASS=${METABASE_DB_PASS:-metabase_demo_2026}
      - METABASE_ADMIN_PASSWORD=${METABASE_ADMIN_PASSWORD:-DemoPass2026!}
      - ERPNEXT_INTERNAL_URL=http://bench:8000
      # yarn network resilience: this host's route to registry.yarnpkg.com is
      # flaky, and `bench get-app erpnext` fails fast when `yarn install` times
      # out (ESOCKETTIMEDOUT). One socket at a time + longer timeout + more
      # fetch retries make the app install survive transient drops.
      - YARN_NETWORK_TIMEOUT=600000
      - YARN_NETWORK_CONCURRENCY=1
      - YARN_FETCH_RETRIES=5
      - YARN_FETCH_RETRY_MAXTIMEOUT=120000
    healthcheck:
      # TCP, not /api/method/ping: on an empty bench_sites volume there is no
      # site yet, so an HTTP check would report unhealthy forever and block
      # `up --wait` on a fresh clone. This answers "is bench listening", which
      # is what dependent services actually need.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 240s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # One-shot seeder: makes `docker compose up` alone yield a WORKING demo site
  # instead of an empty one. Idempotent: exits immediately when a site exists,
  # so it costs about two seconds on every later boot.
  # ---------------------------------------------------------------------------
  seed:
    image: ${BENCH_IMAGE:-comp_demo-bench:v16}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      # `bench migrate` inside the seeder refuses to run without redis
      # ("Service redis_cache is not running"), so wait for both.
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    volumes:
      - bench_sites:/home/frappe/frappe-bench/sites
      - ./seed:/seed:ro
      # The go-kart demo seeder is a repo script, not image content. Mounting it
      # read-only lets seed-site.sh re-add the kart after a restore without
      # baking another copy into the image.
      - ./sandbox/scripts:/sandbox-scripts:ro
      # P7: app sources are no longer mounted here either - they are baked into
      # the image and installed by the image-baked /usr/local/bin/install-all-apps.sh.
      - ./repos/dsh:/home/frappe/frappe-bench/apps/dsh_bridge
    environment:
      - SITE_NAME=${SITE_NAME:-frontend}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      # The seeded dashboard URL is embedded in the /metabase page, so the
      # seeder must know the host port Metabase is published on.
      - METABASE_PORT=${METABASE_PORT:-3005}
      # Space-separated apps to leave uninstalled, e.g. "my_invois" on a site
      # where the LHDN MyInvois layer would conflict with an EU e-invoicing app.
      - SKIP_APPS=${SKIP_APPS:-}
      - ALLOW_PARTIAL=${ALLOW_PARTIAL:-0}
    command: ["bash", "/seed/seed-site.sh"]

  db:
    image: ${MARIADB:?Load versions.env before starting Compose}
    # DURABLE DATADIR (bake track 2b): the site DB now lives on the `db_data`
    # named volume instead of tmpfs, so a container stop / Docker restart no
    # longer discards it. The one-time cost is the initial populate/restore on
    # this host's slow container-storage write path (see bake/README.md). The
    # flush knobs below trade single-transaction crash-safety for write speed;
    # they do not affect durability across restarts.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-flush-method=nosync
      - --innodb-doublewrite=0
      - --sync-binlog=0
      - --skip-log-bin
      - --innodb-buffer-pool-size=512M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  redis-cache:
    image: redis:6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-queue:
    image: redis:6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  node-red:
    image: ${NODE_RED:?Load versions.env before starting Compose}
    ports:
      - "${NODE_RED_PORT:-1880}:1880"
    volumes:
      - node_red_data:/data
      - ${FLOWS_PATH:-./sandbox/node-red/flows.json}:/data/flows.json
    environment:
      - TZ=${TZ:-UTC}
      - ERPNEXT_INTERNAL_URL=${ERPNEXT_INTERNAL_URL:-http://bench:8000}
      - SHOPIFY_STORE=${SHOPIFY_STORE:-4e1075.myshopify.com}
      - SHOPIFY_API_VERSION=${SHOPIFY_API_VERSION:-2026-04}
    depends_on:
      bench:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  scheduler:
    image: comp_demo-scheduler:latest
    build:
      # vendored inside comp_demo so the project builds without ERPNEXT-FIX
      context: ./scheduler
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_ERPNEXT_URL: http://localhost:${ERPNEXT_PORT:-8000}
    ports:
      - "${SCHEDULER_PORT:-3001}:3000"
    environment:
      - ERPNEXT_URL=http://bench:8000
      - ERPNEXT_API_KEY=${SCHEDULER_ERPNEXT_API_KEY:-}
      - ERPNEXT_API_SECRET=${SCHEDULER_ERPNEXT_API_SECRET:-}
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      bench:
        condition: service_started
    restart: unless-stopped

  metabase:
    # BI / analytics dashboard. Metabase's own application metadata lives in the
    # `metabase` schema of the `db` MariaDB (durable via the db_data volume). The
    # ERPNext site DB is registered as a *data source* from the Metabase UI
    # (http://localhost:3000) once, using METABASE_DB_USER / METABASE_DB_PASS.
    # Version is pinned in the root versions.env file.
    image: ${METABASE:?Load versions.env before starting Compose}
    # Run as the image's own unprivileged user (uid 2000).
    # As root, Metabase's entrypoint first runs `chmod o+r /app/metabase.jar`,
    # which forces an overlayfs copy-up of the ~400 MB jar. On Docker Desktop
    # that took 10+ minutes at ~75% CPU with zero log output and no HTTP - the
    # dashboard looked permanently "starting" while its seeded metadata was in
    # fact restored and correct (diagnosed in the P12 seed test). The non-root
    # branch of run_metabase.sh execs java immediately.
    user: "2000:2000"
    ports:
      - "${METABASE_PORT:-3005}:3000"
    environment:
      - MB_DB_TYPE=mysql
      - MB_DB_HOST=db
      - MB_DB_PORT=3306
      - MB_DB_DBNAME=metabase
      - MB_DB_USER=${METABASE_DB_USER:-metabase_user}
      - MB_DB_PASS=${METABASE_DB_PASS:-metabase_demo_2026}
      # Keep the JVM heap within the container memory cap below.
      - JAVA_OPTS=-Xms512m -Xmx2g
    # Cap Metabase so it can't monopolise this host (it tracks 1000+ ERPNext tables).
    mem_limit: 3g
    cpus: 2.0
    depends_on:
      db:
        condition: service_healthy
      # Metabase reads its own metadata schema at boot; the seeder fills it.
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000'"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 120s
    restart: unless-stopped

  webhook-sink:
    # Tunnel-free webhook receiver: ERPNext can post Delivery Note / Stock Entry
    # / Stock Reconciliation webhooks here instead of through ngrok. See
    # tools/webhook-sink/README.md.
    image: python:3.12-alpine
    command: ["python", "/app/server.py"]
    ports:
      - "${WEBHOOK_SINK_PORT:-8088}:8088"
    volumes:
      - ./tools/webhook-sink:/app:ro
      - webhook_sink_data:/data
    environment:
      SINK_PORT: 8088
      SINK_DATA: /data/received.jsonl
      FORWARD_URL: ${FORWARD_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The DSH agent runtime. Beside the bench rather than on the host: the
  # container network carries the hop, so no firewall rule and no host port.
  # Read-only — it holds a read credential and no write path at all (D1).
  dsh-sidecar:
    image: ${DSH_SIDECAR_IMAGE:-node:24-bookworm-slim}
    working_dir: /work
    command: ["node", "packages/dsh-erpnext-sidecar/lib/main.js"]
    volumes:
      # Built on the host with `pnpm --filter @shrdc/dsh-erpnext-sidecar build`;
      # pnpm's node_modules links are relative, so the mount point is free.
      - ../dsh_deepseek-harness:/work:ro
    environment:
      - DSH_SIDECAR_PORT=8099
      - DSH_PROVIDER=${DSH_PROVIDER:-scripted}
      - DSH_MODEL=${DSH_MODEL:-}
      - DSH_API_KEY_ENV=${DSH_API_KEY_ENV:-OPENAI_API_KEY}
      - DSH_SHARED_SECRET=${DSH_SHARED_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ERPNEXT_BASE_URL=http://bench:8000
      - ERPNEXT_USER=${DSH_ERPNEXT_USER:-Administrator}
      - ERPNEXT_PASSWORD=${DSH_ERPNEXT_PASSWORD:-admin}
    restart: unless-stopped

volumes:
  bench_sites:
  db_data:
  node_red_data:
  webhook_sink_data:
