lowdefy: 6.1.0
name: Lowdefy Smart Inventory & Exception Management
version: 1.0.0

# ERPNext stays the source of truth. Secrets resolve server-side via `_secret`;
# nothing is hardcoded or shipped to the browser.

connections:
  - id: erpnext
    type: AxiosHttp
    properties:
      baseURL:
        _secret: ERPNEXT_URL
      headers:
        Authorization:
          _secret: ERPNEXT_AUTH_HEADER
      timeout: 15000

  - id: exceptions
    type: AxiosHttp
    properties:
      baseURL:
        _secret: EXCEPTION_URL

menus:
  - id: default
    links:
      - id: overview
        type: MenuLink
        pageId: overview
        properties:
          title: Overview
          icon: DashboardOutlined
      - id: inventory
        type: MenuLink
        pageId: inventory
        properties:
          title: Inventory Management
          icon: DatabaseOutlined
      - id: scanner
        type: MenuLink
        pageId: scanner
        properties:
          title: QR / Barcode Scanner
          icon: ScanOutlined
      - id: stock-movements
        type: MenuLink
        pageId: stock-movements
        properties:
          title: Stock Movements
          icon: SwapOutlined
      - id: exceptions
        type: MenuLink
        pageId: exceptions
        properties:
          title: Exception Centre
          icon: AlertOutlined
      - id: reports
        type: MenuLink
        pageId: reports
        properties:
          title: Reports & Analytics
          icon: BarChartOutlined
      - id: settings
        type: MenuLink
        pageId: settings
        properties:
          title: Settings
          icon: SettingOutlined

pages:
  - _ref: pages/overview.yaml
  - _ref: pages/inventory.yaml
  - _ref: pages/scanner.yaml
  - _ref: pages/stock-movements.yaml
  - _ref: pages/exceptions.yaml
  - _ref: pages/reports.yaml
  - _ref: pages/settings.yaml
