id: exceptions
type: PageSiderMenu
properties:
  title: Exception Centre
requests:
  - id: list
    type: AxiosHttp
    connectionId: exceptions
    properties:
      url: /exceptions
      method: GET
blocks:
  - id: content
    type: Box
    properties:
      style:
        padding: 24
    events:
      onInitAsync:
        - id: load
          type: Request
          params:
            requestId: list
    blocks:
      - id: title
        type: Title
        properties:
          content: Exception Centre
          level: 2
      - id: search
        type: TextInput
        properties:
          placeholder: Search exceptions
          value:
            _state: search
      - id: table
        type: AgGridBalham
        properties:
          rowData:
            _request: list
          quickFilterText:
            _state: search
          columnDefs:
            - field: id
              headerName: Exception ID
            - field: title
              headerName: Issue
            - field: category
              headerName: Category
            - field: severity
              headerName: Severity
            - field: status
              headerName: Status
            - field: related_record
              headerName: Related Record
            - field: detected_at
              headerName: Detected At
