id: inventory
type: PageSiderMenu
properties:
  title: Inventory Management
requests:
  - id: bins
    type: AxiosHttp
    connectionId: erpnext
    properties:
      url: /api/resource/Bin
      method: GET
      params:
        fields: '["item_code","warehouse","actual_qty","projected_qty","stock_value"]'
        limit_page_length: 1000
blocks:
  - id: content
    type: Box
    properties:
      style:
        padding: 24
    events:
      onInitAsync:
        - id: load_bins
          type: Request
          params:
            requestId: bins
    blocks:
      - id: title
        type: Title
        properties:
          content: Inventory Management
          level: 2
      - id: search
        type: TextInput
        properties:
          placeholder: Search by item code or warehouse
          value:
            _state: search
      - id: table
        type: AgGridBalham
        properties:
          rowData:
            _request: bins.data
          quickFilterText:
            _state: search
          columnDefs:
            - field: item_code
              headerName: Item Code
            - field: warehouse
              headerName: Warehouse
            - field: actual_qty
              headerName: Available
            - field: projected_qty
              headerName: Projected
            - field: stock_value
              headerName: Stock Value
