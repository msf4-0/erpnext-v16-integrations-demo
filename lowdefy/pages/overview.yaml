id: overview
type: PageSiderMenu
properties:
  title: Overview
requests:
  - id: bins
    type: AxiosHttp
    connectionId: erpnext
    properties:
      url: /api/resource/Bin
      method: GET
      params:
        fields: '["item_code","warehouse","actual_qty","stock_value"]'
        limit_page_length: 1000
  - id: warehouses
    type: AxiosHttp
    connectionId: erpnext
    properties:
      url: /api/resource/Warehouse
      method: GET
      params:
        fields: '["name","warehouse_name","disabled"]'
        limit_page_length: 100
blocks:
  - id: content
    type: Box
    properties:
      style:
        padding: 24
    events:
      onInitAsync:
        - id: load
          type: Request
          params:
            all: true
    blocks:
      - id: title
        type: Title
        properties:
          content: Inventory Overview
          level: 2
      - id: kpis
        type: Flex
        blocks:
          - id: k_bins
            type: Statistic
            properties:
              title: Bin records
              value:
                _request: bins.data.length
          - id: k_warehouses
            type: Statistic
            properties:
              title: Warehouses
              value:
                _request: warehouses.data.length
      - id: table
        type: AgGridBalham
        properties:
          rowData:
            _request: bins.data
          columnDefs:
            - field: item_code
            - field: warehouse
            - field: actual_qty
            - field: stock_value
