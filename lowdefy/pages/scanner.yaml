id: scanner
type: PageSiderMenu
properties:
  title: QR / Barcode Scanner
requests:
  - id: serials
    type: AxiosHttp
    connectionId: erpnext
    properties:
      url: /api/resource/Serial No
      method: GET
      params:
        fields: '["name","item_code","warehouse","status"]'
        limit_page_length: 1000
blocks:
  - id: content
    type: Box
    properties:
      style:
        padding: 24
    events:
      onInitAsync:
        - id: load
          type: Request
          params:
            requestId: serials
    blocks:
      - id: title
        type: Title
        properties:
          content: QR / Barcode Scanner
          level: 2
      - id: manual
        type: TextInput
        properties:
          placeholder: Enter or scan item code / serial number
          value:
            _state: manual_id
      - id: results
        type: AgGridBalham
        properties:
          rowData:
            _request: serials.data
          quickFilterText:
            _state: manual_id
          columnDefs:
            - field: name
              headerName: Serial Number
            - field: item_code
              headerName: Item Code
            - field: warehouse
              headerName: Warehouse
            - field: status
              headerName: Status
