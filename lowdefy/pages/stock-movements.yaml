id: stock-movements
type: PageSiderMenu
properties:
  title: Stock Movements
requests:
  - id: entries
    type: AxiosHttp
    connectionId: erpnext
    properties:
      url: /api/resource/Stock Entry
      method: GET
      params:
        fields: '["name","stock_entry_type","from_warehouse","to_warehouse","docstatus","posting_date"]'
        limit_page_length: 1000
blocks:
  - id: content
    type: Box
    properties:
      style:
        padding: 24
    events:
      onInitAsync:
        - id: load
          type: Request
          params:
            requestId: entries
    blocks:
      - id: title
        type: Title
        properties:
          content: Stock Movements
          level: 2
      - id: table
        type: AgGridBalham
        properties:
          rowData:
            _request: entries.data
          columnDefs:
            - field: name
              headerName: Stock Entry
            - field: stock_entry_type
              headerName: Type
            - field: from_warehouse
              headerName: Source Warehouse
            - field: to_warehouse
              headerName: Destination Warehouse
            - field: docstatus
              headerName: Status
            - field: posting_date
              headerName: Date
