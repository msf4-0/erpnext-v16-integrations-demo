name: publish-image

# Builds the bench image once and publishes it to GHCR, so a colleague's
# `docker compose up` pulls layers instead of running bake/bench.Dockerfile.
#
# Publish a new version:
#   git tag v16.1 && git push origin v16.1
# Or run this workflow manually (Actions -> publish-image -> Run workflow).
#
# The pushed tags are:
#   ghcr.io/msf4-0/comp-demo-bench:v16      (moving tag, what compose uses)
#   ghcr.io/msf4-0/comp-demo-bench:<ref>    (immutable, for pinning)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bake/bench.Dockerfile
          push: true
          tags: |
            ghcr.io/msf4-0/comp-demo-bench:v16
            ghcr.io/msf4-0/comp-demo-bench:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the package pullable without a token
        # Public packages are pullable anonymously; this just reminds the
        # operator what to check if a colleague gets "unauthorized".
        run: |
          echo "If pulls fail with 'unauthorized', open"
          echo "  https://github.com/msf4-0?tab=packages"
          echo "and set the comp-demo-bench package visibility to Public."
