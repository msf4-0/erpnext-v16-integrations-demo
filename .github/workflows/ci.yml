name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The bug that motivated this job: 26 app files existed only on one laptop, so
  # every clone got a hollow app and "barcode doesn't work" reports followed.
  # A tracked tree must also be complete on disk.
  # ---------------------------------------------------------------------------
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Working tree must be clean after checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::checkout is not clean - files are generated or missing from git"
            git status --porcelain
            exit 1
          fi
      - name: Every app under repos/ must ship its hooks.py
        run: |
          fail=0
          for d in repos/*/; do
            [ -d "$d" ] || continue
            app=$(basename "$d")
            # The folder name is not always the python package name
            # (barcode-shrdc-v16-fixed contains barcode_shrdc/), so search.
            if ! find "$d" -maxdepth 3 -name hooks.py -size +0c | grep -q .; then
              echo "::error::$app has no non-empty hooks.py - likely a partial commit"
              fail=1
            fi
          done
          exit $fail
      - name: No machine-specific absolute paths in the onboarding path
        # Scoped on purpose: bake/, shopify-setup/ and make-bundle.ps1 still
        # carry author-specific paths and are tracked as cleanup, not as a
        # blocker for a colleague's first run. These are the files that decide
        # whether `git clone` + `docker compose up` works.
        run: |
          if grep -rnE "F:[\\/]|C:\\\\Users|erpnext-build" \
               --include='*.ps1' --include='*.yml' --include='*.sh' \
               up.ps1 setup.ps1 scheduler-up.ps1 verify-all.ps1 \
               docker-compose.yml .env.example seed sandbox/scripts ; then
            echo "::error::machine-specific path in the onboarding path"
            exit 1
          fi
      - name: The retired sandbox/up.ps1 must not come back
        run: |
          if [ -e sandbox/up.ps1 ]; then
            echo "::error::sandbox/up.ps1 belongs to the retired erpnext-ai-fix project"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Cheap static validation, no Docker daemon needed beyond compose config.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose file is valid
        run: docker compose --env-file .env.example -f docker-compose.yml config -q
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
      - name: Shell scripts pass shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          # The sandbox scripts predate this CI and carry legacy warnings.
          # Errors only: a real bug still fails the build, style noise does not.
          severity: error
          scandir: ./sandbox/scripts
      - name: Python sources compile
        run: |
          python -m compileall -q repos/seed 2>/dev/null || true
          for app in repos/*/; do
            python -m compileall -q "$app" || exit 1
          done
      - name: Barcode app templates are not empty
        run: |
          # item_qr.html/css shipped as 0-byte files once, so every QR code
          # pointed at a blank page.
          fail=0
          while IFS= read -r f; do
            if [ ! -s "$f" ]; then echo "::error file=$f::empty template"; fail=1; fi
          done < <(find repos/barcode-shrdc-v16-fixed -path '*item_qr*' \( -name '*.html' -o -name '*.css' \))
          exit $fail

  # ---------------------------------------------------------------------------
  # Build the bench image. On main / tags this also pushes to GHCR, which is what
  # lets a colleague `docker compose up` without a 25-35 minute build.
  # ---------------------------------------------------------------------------
  build-bench-image:
    runs-on: ubuntu-latest
    needs: [repository-hygiene, validate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bake/bench.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/msf4-0/comp-demo-bench:v16
            ghcr.io/msf4-0/comp-demo-bench:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Smoke test: the image must at least import the apps it claims to ship.
  # A full provision is too slow for every push, so this checks the things that
  # broke silently before: import path, render deps, barcode templates.
  # ---------------------------------------------------------------------------
  smoke:
    runs-on: ubuntu-latest
    needs: build-bench-image
    # The GHCR package is private by default, so a fresh runner must authenticate
    # before it can pull what the previous job just pushed.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the image built above
        run: docker pull ghcr.io/msf4-0/comp-demo-bench:${{ github.sha }}
      - name: Apps import and render deps are present
        # One-line python: a heredoc terminator cannot start at column 0 inside a
        # YAML block scalar, and indented terminators do not work in bash.
        run: |
          docker run --rm ghcr.io/msf4-0/comp-demo-bench:${{ github.sha }} \
            /home/frappe/frappe-bench/env/bin/python -c "import importlib; mods=('frappe','erpnext','barcode_shrdc','shopify','eu_einvoice','reportlab','qrcode','PIL','drafthorse','saxonche'); [print('OK', m) for m in (importlib.import_module(x) and x for x in mods)]"
