name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The bug that motivated this job: 26 app files existed only on one laptop, so
  # every clone got a hollow app and "barcode doesn't work" reports followed.
  # A tracked tree must also be complete on disk.
  # ---------------------------------------------------------------------------
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Working tree must be clean after checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::checkout is not clean - files are generated or missing from git"
            git status --porcelain
            exit 1
          fi
      - name: Every app under repos/ must have its hooks.py
        run: |
          fail=0
          for d in repos/*/; do
            app=$(basename "$d")
            [ -d "$d" ] || continue
            if [ ! -f "${d}${app}/hooks.py" ]; then
              echo "::error::$app has no hooks.py - likely a partial commit"
              fail=1
            fi
          done
          exit $fail
      - name: No machine-specific absolute paths in scripts or config
        run: |
          # F:\ / C:\Users paths and the retired erpnext-build folder do not
          # exist on anyone else's machine.
          if grep -rnE 'F:\\\\|F:/ERPNEXT|C:\\\\Users|erpnext-build' \
               --include='*.ps1' --include='*.yml' --include='*.yaml' \
               --include='*.sh' --include='.env.example' . ; then
            echo "::error::machine-specific path found - see matches above"
            exit 1
          fi
      - name: The retired sandbox/up.ps1 must not come back
        run: |
          if [ -e sandbox/up.ps1 ]; then
            echo "::error::sandbox/up.ps1 belongs to the retired erpnext-ai-fix project"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Cheap static validation, no Docker daemon needed beyond compose config.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose file is valid
        run: docker compose --env-file .env.example -f docker-compose.yml config -q
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
      - name: Shell scripts pass shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: ./sandbox/scripts
      - name: Python sources compile
        run: |
          python -m compileall -q repos/seed 2>/dev/null || true
          for app in repos/*/; do
            python -m compileall -q "$app" || exit 1
          done
      - name: Barcode app templates are not empty
        run: |
          # item_qr.html/css shipped as 0-byte files once, so every QR code
          # pointed at a blank page.
          fail=0
          while IFS= read -r f; do
            if [ ! -s "$f" ]; then echo "::error file=$f::empty template"; fail=1; fi
          done < <(find repos/barcode-shrdc-v16-fixed -path '*item_qr*' \( -name '*.html' -o -name '*.css' \))
          exit $fail

  # ---------------------------------------------------------------------------
  # Build the bench image. On main / tags this also pushes to GHCR, which is what
  # lets a colleague `docker compose up` without a 25-35 minute build.
  # ---------------------------------------------------------------------------
  build-bench-image:
    runs-on: ubuntu-latest
    needs: [repository-hygiene, validate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bake/bench.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/msf4-0/comp-demo-bench:v16
            ghcr.io/msf4-0/comp-demo-bench:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Smoke test: the image must at least import the apps it claims to ship.
  # A full provision is too slow for every push, so this checks the things that
  # broke silently before: import path, render deps, barcode templates.
  # ---------------------------------------------------------------------------
  smoke:
    runs-on: ubuntu-latest
    needs: build-bench-image
    steps:
      - uses: actions/checkout@v4
      - name: Pull the image built above
        run: docker pull ghcr.io/msf4-0/comp-demo-bench:${{ github.sha }}
      - name: Apps import and render deps are present
        run: |
          docker run --rm ghcr.io/msf4-0/comp-demo-bench:${{ github.sha }} bash -lc '
            set -e
            cd /home/frappe/frappe-bench
            ./env/bin/python - <<PY
          import importlib, sys
          for mod in ("frappe", "erpnext", "barcode_shrdc", "shopify", "eu_einvoice"):
              importlib.import_module(mod)
              print("import OK:", mod)
          for mod in ("reportlab", "qrcode", "PIL", "drafthorse", "saxonche"):
              importlib.import_module(mod)
              print("dep OK:", mod)
          PY
          '
