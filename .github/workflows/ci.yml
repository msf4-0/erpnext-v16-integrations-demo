name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The bug that motivated this job: 26 app files existed only on one laptop, so
  # every clone got a hollow app and "barcode doesn't work" reports followed.
  # A tracked tree must also be complete on disk.
  # ---------------------------------------------------------------------------
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Working tree must be clean after checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::checkout is not clean - files are generated or missing from git"
            git status --porcelain
            exit 1
          fi
      - name: Every app under repos/ must ship its hooks.py
        run: |
          fail=0
          for d in repos/*/; do
            [ -d "$d" ] || continue
            app=$(basename "$d")
            [ -f "$d/.frappe-app" ] || continue     # only apps opt in
            if ! find "$d" -maxdepth 3 -name hooks.py -size +0c | grep -q .; then
              echo "::error::$app has no non-empty hooks.py - likely a partial commit"
              fail=1
            fi
          done
          exit $fail
      - name: No machine-specific absolute paths in the onboarding path
        # Executable/config surface only. .github is excluded because the
        # workflow names the patterns it searches for, .opencode because its
        # agent permission globs are machine-bound by design, and
        # bake/move-docker-admin.ps1 because it is a one-off host migration
        # helper whose whole job is moving THIS machine's Docker disk - it is
        # not an onboarding path. Prose docs still describe this machine and are
        # not onboarding blockers.
        run: |
          if grep -rnE "F:[\\/]|C:\\\\Users|erpnext-build" \
               --include='*.ps1' --include='*.yml' --include='*.sh' \
               --include='.env.example' \
               --exclude-dir=.github --exclude-dir=.git --exclude-dir=.opencode \
               --exclude-dir=__pycache__ \
               --exclude=move-docker-admin.ps1 . ; then
            echo "::error::machine-specific path in the onboarding path"
            exit 1
          fi
      - name: The retired sandbox/up.ps1 must not come back
        run: |
          if [ -e sandbox/up.ps1 ]; then
            echo "::error::sandbox/up.ps1 belonged to the retired erpnext-fix project (removed 2026-11-17)"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Cheap static validation, no Docker daemon needed beyond compose config.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose file is valid
        # versions.env carries the required pins (ERPNEXT_BASE, MARIADB,
        # METABASE, NODE_RED). Without it the compose file's :? guards abort
        # `config`, so this step failed on every push.
        run: docker compose --env-file .env.example --env-file versions.env -f docker-compose.yml config -q
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
      - name: Shell scripts pass shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          # The sandbox scripts predate this CI and carry legacy warnings.
          # Errors only: a real bug still fails the build, style noise does not.
          severity: error
          scandir: ./sandbox/scripts
      - name: Python sources compile
        run: |
          python -m compileall -q repos/seed 2>/dev/null || true
          for app in repos/*/; do
            python -m compileall -q "$app" || exit 1
          done
      - name: Barcode app templates are not empty
        run: |
          # item_qr.html/css shipped as 0-byte files once, so every QR code
          # pointed at a blank page.
          fail=0
          while IFS= read -r f; do
            if [ ! -s "$f" ]; then echo "::error file=$f::empty template"; fail=1; fi
          done < <(find repos/barcode-shrdc-v16-fixed -path '*item_qr*' \( -name '*.html' -o -name '*.css' \))
          exit $fail

  # ---------------------------------------------------------------------------
  # Build the bench image and smoke-test it, WITHOUT pushing anywhere.
  #
  # CI must not depend on GHCR: that package is private, and publishing is a
  # separate, deliberate action (publish-image.yml on tags / manual dispatch).
  # The image is loaded into this runner so the import smoke test runs in-job.
  # ---------------------------------------------------------------------------
  build-bench-image:
    runs-on: ubuntu-latest
    needs: [repository-hygiene, validate]
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Read the pinned base image
        # versions.env is the single source of truth. ERPNEXT_BASE has no
        # default in bake/bench.Dockerfile, so omitting the build-arg made the
        # image build fail with a blank FROM (never surfaced: this job was
        # always skipped behind the two failing prerequisite jobs).
        run: |
          base="$(sed -n 's/^ERPNEXT_BASE=//p' versions.env | head -1)"
          if [ -z "$base" ]; then
            echo "::error::ERPNEXT_BASE missing from versions.env"
            exit 1
          fi
          echo "ERPNEXT_BASE=$base" >> "$GITHUB_ENV"
      - name: Build the bench image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bake/bench.Dockerfile
          build-args: ERPNEXT_BASE=${{ env.ERPNEXT_BASE }}
          push: false
          load: true
          tags: comp_demo-bench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Apps import and render deps are present
        # One-line python: a heredoc terminator cannot start at column 0 inside a
        # YAML block scalar, and indented terminators do not work in bash.
        run: |
          docker run --rm comp_demo-bench:ci \
            /home/frappe/frappe-bench/env/bin/python -c "import importlib; mods=('frappe','erpnext','barcode_shrdc','shopify','reportlab','qrcode','PIL'); [print('OK', m) for m in (importlib.import_module(x) and x for x in mods)]"
